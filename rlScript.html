<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
(function(){
  let rlData = null;
  let _chDonut = null, _chTemas = null, _chInc = null;
  function _destroyChart(ref) { if(ref) { try { ref.destroy(); } catch(e){} } return null; }
  function rlInit() {
    document.getElementById('rl-spinner').style.display = 'flex';
    document.querySelectorAll('.rl-panel').forEach(p => p.style.display = 'none');
    rlCargarDatos();
  }
  window.rlCargarDatos = function() {
    document.getElementById('rl-spinner').style.display = 'flex';
    document.querySelectorAll('.rl-panel').forEach(p => p.style.display = 'none');
    google.script.run
      .withSuccessHandler(rlOnData)
      .withFailureHandler(rlOnError)
      .obtenerDashboardLaboral();
  };
  function rlOnError(e) {
    document.getElementById('rl-spinner').innerHTML =
      `<div style="color:#ef4444;text-align:center"><i class="fas fa-exclamation-circle" style="font-size:2rem;margin-bottom:.5rem;display:block"></i>Error al cargar datos<br><small style="color:#9ca3af">${e.message||e}</small></div>`;
  }
  function rlOnData(data) {
    rlData = data;
    document.getElementById('rl-spinner').style.display = 'none';
    rlRenderKPIs();
    rlRenderGeneral();
    rlRenderTemas();
    rlRenderIncumplidores();
    rlRenderVacunas();
    const active = document.querySelector('.rl-panel.active') || document.getElementById('rl-p-general');
    active.style.display = 'block';
    active.classList.add('active');
  }
  function rlRenderKPIs() {
    const k = rlData.kpis;
    setText('rl-k-workers', k.totalTrabajadores);
    setText('rl-k-pct', k.porcentajeCumplimiento + '%');
    setText('rl-k-pct-sub', k.totalAprobados + ' aprobados / ' + k.totalCeldas + ' (activos × temas)');
    setText('rl-k-inc', k.totalIncumplidores);
    setText('rl-k-cursos', k.totalTemas);
    setText('rl-k-asig', k.totalCeldas);
    setText('rl-k-asig-sub', 'Total activos × temas (cross-comparación)');
    const totalVac = rlData.vacunasData.length;
    const completos = rlData.vacunasData.filter(v => Object.values(v.vacunas).every(x => x.tiene)).length;
    setText('rl-k-vac', totalVac - completos);
    const pct = k.porcentajeCumplimiento;
    const kEl = document.querySelector('.rl-kpi.green .rl-kpi-val');
    if(kEl) kEl.style.color = pct >= 80 ? '#059669' : pct >= 60 ? '#d97706' : '#dc2626';
  }
  function rlRenderGeneral() {
    const k = rlData.kpis;
    const pct = k.porcentajeCumplimiento;
    const color = pct >= 80 ? '#10b981' : pct >= 60 ? '#f59e0b' : '#ef4444';
    setText('rl-big-pct', pct + '%');
    document.getElementById('rl-big-pct').style.color = color;
    setText('rl-big-pct-sub', k.totalAprobados + ' aprobados de ' + k.totalCeldas);
    _chDonut = _destroyChart(_chDonut);
    const totalCeldas = k.totalCeldas || 1;
    const reprobados  = rlData.resumenPorTema.reduce((s,t) => s + (t.reprobados||0), 0);
    const caducados   = rlData.resumenPorTema.reduce((s,t) => s + (t.caducados||0), 0);
    const pendientes  = totalCeldas - k.totalAprobados - reprobados - caducados;
    _chDonut = new Chart(document.getElementById('ch-donut'), {
      type: 'doughnut',
      data: {
        labels: ['Aprobado','Reprobado','Caducado','Pendiente'],
        datasets: [{ data: [k.totalAprobados, reprobados, caducados, Math.max(pendientes,0)],
          backgroundColor: ['#10b981','#ef4444','#8b5cf6','#fbbf24'],
          borderWidth: 2, borderColor: '#fff', hoverOffset: 6 }]
      },
      options: { cutout:'72%', plugins:{ legend:{ display:false }, tooltip:{ callbacks:{
        label: ctx => ` ${ctx.label}: ${ctx.parsed} (${Math.round(ctx.parsed/totalCeldas*100)}%)`
      }}}, animation:{ animateRotate:true, duration:700 } }
    });
    const inc = rlData.incumplidores.slice(0, 5);
    const colors = ['#ef4444','#f97316','#f59e0b','#eab308','#84cc16'];
    const html = inc.map((t,i) => `
      <div class="rl-rank-item">
        <div class="rl-rank-avatar" style="background:${colors[i]||'#6b7280'}">${rlInitials(t.nombre)}</div>
        <div class="rl-rank-info">
          <div class="rl-ri-name">${rlEsc(t.nombre)}</div>
          <div class="rl-ri-sub">${rlEsc(t.cargo)} &bull; ${t.reprobados+t.caducados} incumplido(s)</div>
          <div style="margin-top:.3rem">
            ${t.reprobados ? `<span class="rl-badge rp"><i class="fas fa-times-circle"></i>${t.reprobados} reprobado(s)</span> ` : ''}
            ${t.caducados  ? `<span class="rl-badge cd"><i class="fas fa-hourglass-end"></i>${t.caducados} caducado(s)</span>` : ''}
          </div>
        </div>
        <div class="rl-rank-pct">
          <div class="rl-rp-num" style="color:${t.porcentaje>=80?'#10b981':t.porcentaje>=60?'#f59e0b':'#ef4444'}">${t.porcentaje}%</div>
          <div class="rl-rp-lbl">cumplimiento</div>
        </div>
      </div>
    `).join('');
    document.getElementById('rl-top-inc-list').innerHTML = inc.length ? html : '<div style="color:#9ca3af;text-align:center;padding:1rem"><i class="fas fa-check-circle" style="color:#10b981;font-size:1.5rem"></i><br>Sin incumplidores</div>';
    _chTemas = _destroyChart(_chTemas);
    const temas = [...rlData.resumenPorTema].sort((a,b) => {
      const pa = a.total ? a.aprobados/a.total : 0;
      const pb = b.total ? b.aprobados/b.total : 0;
      return pa - pb;
    });
    const labels = temas.map(t => t.tema.length > 30 ? t.tema.slice(0,28)+'…' : t.tema);
    const mkDs = (key, label, color2) => ({
      label, backgroundColor: color2,
      data: temas.map(t => t.total ? Math.round(t[key]/t.total*100) : 0)
    });
    const barH = Math.max(temas.length * 32 + 60, 120);
    document.getElementById('ch-temas').style.height = barH + 'px';
    _chTemas = new Chart(document.getElementById('ch-temas'), {
      type: 'bar',
      data: { labels,
        datasets: [
          mkDs('aprobados','Aprobado','#10b981'),
          mkDs('reprobados','Reprobado','#ef4444'),
          mkDs('caducados','Caducado','#8b5cf6'),
          mkDs('pendientes','Pendiente','#fbbf24')
        ]
      },
      options: {
        indexAxis: 'y', responsive:true, maintainAspectRatio:false,
        scales: {
          x: { stacked:true, max:100, ticks:{ callback: v => v+'%', font:{size:11} }, grid:{color:'#f1f5f9'} },
          y: { stacked:true, ticks:{ font:{size:11} } }
        },
        plugins: {
          legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } },
          tooltip:{ callbacks:{ label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.x}%` } }
        },
        animation:{ duration:600 }
      }
    });
  }
  function rlRenderTemas() { rlFiltrarTemas(); }
  window.rlFiltrarTemas = function() {
    const q   = (document.getElementById('rl-temas-search').value || '').toLowerCase();
    const ord = document.getElementById('rl-temas-order').value;
    let rows = rlData.resumenPorTema.filter(t => t.tema.toLowerCase().includes(q));
    rows.sort((a,b) => {
      const pa = a.registros ? a.aprobados/a.registros : 0;
      const pb = b.registros ? b.aprobados/b.registros : 0;
      if(ord==='pct-asc')  return pa - pb;
      if(ord==='pct-desc') return pb - pa;
      return a.tema.localeCompare(b.tema);
    });
    const html = rows.map((t,i) => {
      const pct2 = t.total ? Math.round(t.aprobados/t.total*100) : 0;
      const color = pct2>=80?'#10b981':pct2>=60?'#f59e0b':'#ef4444';
      return `
        <tr>
          <td style="color:#9ca3af">${i+1}</td>
          <td style="font-weight:600;color:#1e293b">${rlEsc(t.tema)}</td>
          <td style="font-weight:600;color:#3b82f6">${t.total}</td>
          <td style="color:#6b7280">${t.registros}</td>
          <td><span class="rl-badge ap">${t.aprobados}</span></td>
          <td>${t.reprobados ? `<span class="rl-badge rp">${t.reprobados}</span>` : '<span style="color:#9ca3af">0</span>'}</td>
          <td>${t.caducados  ? `<span class="rl-badge cd">${t.caducados}</span>`  : '<span style="color:#9ca3af">0</span>'}</td>
          <td>${t.pendientes ? `<span class="rl-badge pd">${t.pendientes}</span>` : '<span style="color:#9ca3af">0</span>'}</td>
          <td><b style="color:${color}">${pct2}%</b></td>
          <td style="min-width:120px">
            <div class="rl-progress-wrap" style="height:8px">
              <div class="rl-progress-bar" style="width:${pct2}%;background:${color}"></div>
            </div>
          </td>
        </tr>`;
    }).join('');
    document.getElementById('rl-temas-tbody').innerHTML = html || '<tr><td colspan="10" style="text-align:center;color:#9ca3af;padding:1.5rem">Sin resultados</td></tr>';
  };
  function rlRenderIncumplidores() {
    _chInc = _destroyChart(_chInc);
    const top10 = rlData.incumplidores.slice(0, 10);
    if (top10.length) {
      const incH = Math.max(top10.length * 36 + 60, 120);
      document.getElementById('ch-inc').style.height = incH + 'px';
      _chInc = new Chart(document.getElementById('ch-inc'), {
        type: 'bar',
        data: {
          labels: top10.map(t => t.nombre.split(' ').slice(0,2).join(' ')),
          datasets: [{
            label: '% Cumplimiento',
            data: top10.map(t => t.porcentaje),
            backgroundColor: top10.map(t => t.porcentaje >= 80 ? '#10b981' : t.porcentaje >= 60 ? '#f59e0b' : '#ef4444'),
            borderRadius: 6, borderSkipped: false
          }]
        },
        options: {
          indexAxis: 'y', responsive:true, maintainAspectRatio:false,
          scales: {
            x: { max:100, ticks:{ callback: v => v+'%', font:{size:11} }, grid:{color:'#f1f5f9'} },
            y: { ticks:{ font:{size:11} } }
          },
          plugins: {
            legend:{ display:false },
            tooltip:{ callbacks:{ label: ctx => ` ${ctx.parsed.x}% cumplimiento` } }
          },
          animation:{ duration:600 }
        }
      });
    } else {
      const card = document.getElementById('rl-inc-chart-card');
      if(card) card.style.display = 'none';
    }
    rlFiltrarIncumplidores();
  }
  window.rlFiltrarIncumplidores = function() {
    const q    = (document.getElementById('rl-inc-search').value || '').toLowerCase();
    const filt = document.getElementById('rl-inc-filter').value;
    let rows = rlData.incumplidores.filter(t => {
      const match = t.nombre.toLowerCase().includes(q) || t.dni.includes(q);
      if(!match) return false;
      if(filt==='reprobado') return t.reprobados > 0;
      if(filt==='caducado')  return t.caducados  > 0;
      if(filt==='pendiente') return t.pendientes > 0;
      return true;
    });
    setText('rl-inc-count', rows.length + ' trabajador(es)');
    const html = rows.map((t,i) => {
      const color = t.porcentaje>=80?'#10b981':t.porcentaje>=60?'#f59e0b':'#ef4444';
      const temasInc = t.detalle.filter(d => d.estado !== 'Aprobado')
        .map(d => `<span class="rl-badge ${d.estado==='Reprobado'?'rp':'cd'}" style="margin:1px 2px" title="Fecha: ${rlEsc(d.fecha||'')}">${rlEsc(d.tema)}</span>`).join('');
      return `
        <tr>
          <td style="color:#9ca3af">${i+1}</td>
          <td style="font-weight:600;color:#1e293b">
            <div style="display:flex;align-items:center;gap:.5rem">
              <div style="width:30px;height:30px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;font-weight:700;flex-shrink:0">${rlInitials(t.nombre)}</div>
              ${rlEsc(t.nombre)}
            </div>
          </td>
          <td style="color:#6b7280;font-size:.78rem">${rlEsc(t.dni)}</td>
          <td style="font-size:.78rem">${rlEsc(t.cargo)}</td>
          <td style="font-size:.78rem">${rlEsc(t.empresa)}</td>
          <td>${t.temasTotal}</td>
          <td><span class="rl-badge ap">${t.aprobados}</span></td>
          <td>${t.reprobados ? `<span class="rl-badge rp">${t.reprobados}</span>` : '—'}</td>
          <td>${t.caducados  ? `<span class="rl-badge cd">${t.caducados}</span>`  : '—'}</td>
          <td>${t.pendientes ? `<span class="rl-badge pd">${t.pendientes}</span>` : '—'}</td>
          <td><b style="color:${color}">${t.porcentaje}%</b></td>
          <td style="max-width:300px;white-space:normal">${temasInc}</td>
        </tr>`;
    }).join('');
    document.getElementById('rl-inc-tbody').innerHTML = html || '<tr><td colspan="12" style="text-align:center;color:#9ca3af;padding:1.5rem">Sin incumplidores con estos filtros</td></tr>';
  };
  function rlRenderVacunas() {
    const total = rlData.vacunasData.length || 1;
    const cardsHtml = rlData.resumenVacunas.map(v => {
      const pct2 = Math.round(v.conVacuna / total * 100);
      const r = 32, circ = 2*Math.PI*r;
      const offset = circ - (pct2/100)*circ;
      const color = pct2>=80?'#10b981':pct2>=60?'#f59e0b':'#ef4444';
      return `
        <div class="rl-vac-card ${pct2<60?'danger':''}">
          <div class="rl-vac-name">${rlEsc(v.vacuna)}</div>
          <div class="rl-vac-donut">
            <svg width="80" height="80" viewBox="0 0 80 80">
              <circle cx="40" cy="40" r="${r}" fill="none" stroke="#f1f5f9" stroke-width="8"/>
              <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="8"
                stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
            </svg>
            <div class="rl-vac-pct-inner" style="color:${color}">${pct2}%</div>
          </div>
          <div class="rl-vac-sub">${v.conVacuna} de ${total} trabajadores</div>
        </div>`;
    }).join('');
    document.getElementById('rl-vac-grid').innerHTML = cardsHtml;
    const headers = rlData.vacunasHeaders;
    document.getElementById('rl-vac-thead').innerHTML = `
      <tr>
        <th>#</th><th>DNI</th><th>Nombre</th>
        ${headers.map(h => `<th style="font-size:.7rem;white-space:nowrap">${rlEsc(h)}</th>`).join('')}
        <th>Completo</th>
      </tr>`;
    rlFiltrarVacunas();
  }
  window.rlFiltrarVacunas = function() {
    const q    = (document.getElementById('rl-vac-search').value || '').toLowerCase();
    const filt = document.getElementById('rl-vac-filter').value;
    const headers = rlData.vacunasHeaders;
    let rows = rlData.vacunasData.filter(v => {
      const match = v.nombre.toLowerCase().includes(q) || v.dni.includes(q);
      if(!match) return false;
      const completo = headers.every(h => v.vacunas[h]?.tiene);
      if(filt==='completo')   return completo;
      if(filt==='incompleto') return !completo;
      return true;
    });
    const html = rows.map((v,i) => {
      const completo = headers.every(h => v.vacunas[h]?.tiene);
      const cells = headers.map(h => {
        const val = v.vacunas[h];
        if(val?.tiene) return `<td style="text-align:center"><span style="color:#10b981;font-size:1.1rem" title="${rlEsc(val.valor)}">&#10003;</span></td>`;
        return `<td style="text-align:center"><span style="color:#e5e7eb;font-size:1.1rem">&#10005;</span></td>`;
      }).join('');
      return `
        <tr>
          <td style="color:#9ca3af">${i+1}</td>
          <td style="font-size:.78rem;color:#6b7280">${rlEsc(v.dni)}</td>
          <td style="font-weight:600;color:#1e293b;white-space:nowrap">${rlEsc(v.nombre)}</td>
          ${cells}
          <td style="text-align:center">${completo ? '<span class="rl-badge ap">Sí</span>' : '<span class="rl-badge rp">No</span>'}</td>
        </tr>`;
    }).join('');
    document.getElementById('rl-vac-tbody').innerHTML = html || '<tr><td colspan="20" style="text-align:center;color:#9ca3af;padding:1.5rem">Sin resultados</td></tr>';
  };
  window.rlFiltrarWorkers = function() {
    const q = (document.getElementById('rl-worker-input').value || '').trim().toLowerCase();
    const list = document.getElementById('rl-worker-list');
    if(q.length < 2) { list.style.display='none'; return; }
    const matches = rlData.cumplimientoPorTrabajador.filter(t =>
      t.nombre.toLowerCase().includes(q) || t.dni.includes(q)
    ).slice(0,8);
    if(!matches.length) { list.style.display='none'; return; }
    list.innerHTML = matches.map(t => `
      <div class="rl-search-item" onclick="rlSelectWorker('${rlEsc(t.dni)}')">
        <div style="font-weight:600;color:#1e293b">${rlEsc(t.nombre)}</div>
        <div class="rl-si-dni">${rlEsc(t.dni)} &bull; ${rlEsc(t.cargo)}</div>
      </div>`).join('');
    list.style.display = 'block';
  };
  window.rlSelectWorker = function(dni) {
    document.getElementById('rl-worker-list').style.display = 'none';
    const t = rlData.cumplimientoPorTrabajador.find(w => w.dni === dni);
    if(!t) return;
    document.getElementById('rl-worker-input').value = t.nombre;
    const vacTrab = rlData.vacunasData.find(v => v.dni === dni);
    const color = t.porcentaje>=80?'#10b981':t.porcentaje>=60?'#f59e0b':'#ef4444';
    const badgeMap = {Aprobado:'ap',Reprobado:'rp',Pendiente:'pd',Caducado:'cd'};
    const detalleHtml = t.detalle.length
      ? `<div class="rl-detail-grid">
          ${t.detalle.map(d => `
            <div class="rl-detail-item ${badgeMap[d.estado]||'nd'}">
              <div style="flex:1">
                <div class="rl-di-name">${rlEsc(d.tema)}</div>
                ${d.fecha ? `<div style="font-size:.68rem;color:#9ca3af;margin-top:.15rem"><i class="fas fa-calendar-alt me-1"></i>${rlEsc(d.fecha)}</div>` : ''}
              </div>
              <span class="rl-badge ${badgeMap[d.estado]||'nd'}">${d.estado}</span>
            </div>`).join('')}
        </div>`
      : '<div style="color:#9ca3af;padding:1rem">Sin registros en B DATOS para este trabajador</div>';
    const vacHtml = vacTrab
      ? `<div class="rl-card" style="margin-top:1.2rem">
          <div class="rl-card-title"><i class="fas fa-syringe"></i>Vacunas</div>
          <div style="display:flex;flex-wrap:wrap;gap:.5rem">
            ${rlData.vacunasHeaders.map(h => {
              const val = vacTrab.vacunas[h];
              const cls = val?.tiene ? 'ap' : 'rp';
              return `<span class="rl-badge ${cls}">${rlEsc(h)}${val?.tiene && val.valor ? ': '+rlEsc(val.valor) : ''}</span>`;
            }).join('')}
          </div>
        </div>`
      : `<div class="rl-card" style="margin-top:1.2rem">
          <div class="rl-card-title"><i class="fas fa-syringe"></i>Vacunas</div>
          <div style="color:#9ca3af;padding:.5rem">Sin datos en INFO ADICIONAL</div>
        </div>`;
    document.getElementById('rl-worker-detail').style.display = 'block';
    document.getElementById('rl-worker-empty').style.display  = 'none';
    document.getElementById('rl-worker-detail').innerHTML = `
      <div class="rl-worker-card">
        <div class="rl-worker-avatar"><i class="fas fa-user"></i></div>
        <div class="rl-worker-info">
          <h4>${rlEsc(t.nombre)}</h4>
          <p><i class="fas fa-id-badge me-1"></i>${rlEsc(t.dni)} &bull; ${rlEsc(t.cargo)}</p>
          <p><i class="fas fa-building me-1"></i>${rlEsc(t.empresa)}</p>
          <div style="margin-top:.6rem;display:flex;gap:.4rem;flex-wrap:wrap">
            <span class="rl-badge ap"><i class="fas fa-check"></i>${t.aprobados} Aprobados</span>
            ${t.reprobados ? `<span class="rl-badge rp"><i class="fas fa-times"></i>${t.reprobados} Reprobados</span>` : ''}
            ${t.caducados  ? `<span class="rl-badge cd"><i class="fas fa-hourglass-end"></i>${t.caducados} Caducados</span>` : ''}
          </div>
        </div>
        <div class="rl-pct-big">
          <div class="rl-pct-num" style="color:#fff">${t.porcentaje}%</div>
          <div class="rl-pct-lbl">cumplimiento</div>
          <div style="margin-top:.5rem">
            <div style="background:rgba(255,255,255,.2);border-radius:50px;height:6px;width:90px;overflow:hidden">
              <div style="background:#fff;height:100%;border-radius:50px;width:${t.porcentaje}%"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="rl-card">
        <div class="rl-card-title"><i class="fas fa-graduation-cap"></i>Todos los temas de B DATOS (${t.temasTotal} temas)</div>
        ${detalleHtml}
      </div>
      ${vacHtml}
    `;
  };
  window.rlTab = function(btn, panelId) {
    document.querySelectorAll('.rl-tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.rl-panel').forEach(p => { p.style.display='none'; p.classList.remove('active'); });
    const panel = document.getElementById(panelId);
    if(panel) { panel.style.display='block'; panel.classList.add('active'); }
    if(panelId==='rl-p-worker' && rlData) {
      const det = document.getElementById('rl-worker-detail');
      if(!det || det.style.display==='none') document.getElementById('rl-worker-empty').style.display='block';
    }
  };
  function setText(id, val) {
    const el = document.getElementById(id);
    if(el) el.textContent = val;
  }
  function rlEsc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function rlInitials(name) {
    const parts = String(name||'').trim().split(' ');
    return (parts[0]?.[0]||'') + (parts[1]?.[0]||'');
  }
  document.addEventListener('click', function(e) {
    const list = document.getElementById('rl-worker-list');
    if(list && !list.contains(e.target) && e.target.id !== 'rl-worker-input') list.style.display='none';
  });
  if(document.readyState === 'loading') {
