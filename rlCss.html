<style>
/* ── ReportesLaboral — Tablero Ejecutivo ── */ #rl-wrapper{font-family:'Inter',system-ui,sans-serif;background:#f0f4f8;min-height:100vh;padding:1.5rem;}
/* Header */ .rl-header{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 60%,#0ea5e9 100%);border-radius:18px;padding:1.6rem 2rem;margin-bottom:1.5rem;color:#fff;display:flex;align-items:center;gap:1.2rem;box-shadow:0 8px 32px rgba(37,99,235,.35);}
.rl-header .rl-icon{font-size:2.8rem;opacity:.9;}
.rl-header h2{margin:0;font-size:1.6rem;font-weight:700;}
.rl-header p{margin:0;opacity:.8;font-size:.9rem;}
.rl-btn-refresh{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:.45rem 1rem;font-size:.85rem;cursor:pointer;transition:all .2s;}
.rl-btn-refresh:hover{background:rgba(255,255,255,.28);}
/* KPI Cards */ .rl-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem;}
.rl-kpi{background:#fff;border-radius:14px;padding:1.1rem 1.3rem;box-shadow:0 2px 12px rgba(0,0,0,.07);border-left:4px solid #2563eb;display:flex;flex-direction:column;gap:.3rem;}
.rl-kpi.green{border-color:#10b981;}
.rl-kpi.orange{border-color:#f59e0b;}
.rl-kpi.red{border-color:#ef4444;}
.rl-kpi.purple{border-color:#8b5cf6;}
.rl-kpi.teal{border-color:#14b8a6;}
.rl-kpi .rl-kpi-label{font-size:.72rem;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.rl-kpi .rl-kpi-val{font-size:2rem;font-weight:800;color:#1e293b;line-height:1;}
.rl-kpi .rl-kpi-sub{font-size:.75rem;color:#94a3b8;}
.rl-kpi .rl-kpi-icon{font-size:1.4rem;align-self:flex-end;margin-top:-.3rem;opacity:.6;}
/* Tab Nav */ .rl-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.2rem;}
.rl-tab-btn{background:#fff;border:2px solid #e2e8f0;color:#64748b;border-radius:10px;padding:.45rem 1.1rem;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;}
.rl-tab-btn:hover{border-color:#2563eb;color:#2563eb;}
.rl-tab-btn.active{background:#2563eb;border-color:#2563eb;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3);}
/* Panels */ .rl-panel{display:none;}
.rl-panel.active{display:block;}
/* Cards base */ .rl-card{background:#fff;border-radius:14px;padding:1.4rem;box-shadow:0 2px 14px rgba(0,0,0,.07);margin-bottom:1.2rem;}
.rl-card-title{font-size:1rem;font-weight:700;color:#1e293b;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;}
.rl-card-title i{color:#2563eb;}
/* Progress bar */ .rl-progress-wrap{background:#f1f5f9;border-radius:50px;height:10px;overflow:hidden;}
.rl-progress-bar{height:100%;border-radius:50px;transition:width .5s;}
/* Tabla general */ .rl-table-wrap{overflow-x:auto;}
.rl-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.rl-table th{background:#f8fafc;color:#374151;font-weight:700;padding:.7rem .9rem;text-align:left;border-bottom:2px solid #e5e7eb;white-space:nowrap;}
.rl-table td{padding:.65rem .9rem;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
.rl-table tbody tr:hover{background:#f8fafc;}
/* Badge estado */ .rl-badge{display:inline-flex;align-items:center;gap:.28rem;padding:.22rem .65rem;border-radius:20px;font-size:.73rem;font-weight:700;white-space:nowrap;}
.rl-badge.ap{background:#d1fae5;color:#065f46;}
.rl-badge.rp{background:#fee2e2;color:#991b1b;}
.rl-badge.pd{background:#fef3c7;color:#92400e;}
.rl-badge.cd{background:#ede9fe;color:#5b21b6;}
.rl-badge.nd{background:#f1f5f9;color:#64748b;}
/* Barra por tema */ .rl-topic-bar{display:flex;align-items:center;gap:.7rem;margin-bottom:.65rem;font-size:.8rem;}
.rl-topic-bar .rl-topic-name{flex:0 0 200px;color:#374151;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rl-topic-bar .rl-topic-track{flex:1;background:#f1f5f9;border-radius:50px;height:14px;overflow:hidden;display:flex;}
.rl-topic-bar .rl-seg-ap{background:#10b981;height:100%;}
.rl-topic-bar .rl-seg-rp{background:#ef4444;height:100%;}
.rl-topic-bar .rl-seg-cd{background:#8b5cf6;height:100%;}
.rl-topic-bar .rl-seg-pd{background:#fbbf24;height:100%;}
.rl-topic-bar .rl-topic-pct{flex:0 0 40px;text-align:right;font-weight:700;color:#1e293b;}
/* Trabajador card (Por Trabajador panel) */ .rl-worker-card{background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;border-radius:14px;padding:1.3rem 1.5rem;margin-bottom:1.2rem;display:flex;gap:1.2rem;align-items:center;}
.rl-worker-avatar{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;}
.rl-worker-info h4{margin:0 0 .2rem;font-size:1.1rem;font-weight:700;}
.rl-worker-info p{margin:0;opacity:.8;font-size:.82rem;}
.rl-pct-big{margin-left:auto;text-align:center;flex-shrink:0;}
.rl-pct-big .rl-pct-num{font-size:1.4rem;font-weight:800;line-height:1.2;}
.rl-pct-big .rl-pct-lbl{font-size:.7rem;opacity:.75;}
/* Detalle temas trabajador */ .rl-detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem;}
.rl-detail-item{border-radius:10px;padding:.75rem 1rem;border-left:4px solid #e5e7eb;background:#f8fafc;font-size:.8rem;display:flex;justify-content:space-between;align-items:center;}
.rl-detail-item.ap{border-color:#10b981;background:#f0fdf4;}
.rl-detail-item.rp{border-color:#ef4444;background:#fef2f2;}
.rl-detail-item.pd{border-color:#f59e0b;background:#fffbeb;}
.rl-detail-item.cd{border-color:#8b5cf6;background:#f5f3ff;}
.rl-detail-item .rl-di-name{font-weight:600;color:#1e293b;flex:1;margin-right:.5rem;}
/* Vacunas grid */ .rl-vac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.9rem;}
.rl-vac-card{border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:1rem;text-align:center;border-top:4px solid #10b981;}
.rl-vac-card.danger{border-color:#ef4444;}
.rl-vac-card .rl-vac-name{font-size:.75rem;font-weight:700;color:#374151;margin-bottom:.6rem;}
.rl-vac-card .rl-vac-pct{font-size:1.9rem;font-weight:800;color:#1e293b;}
.rl-vac-card .rl-vac-sub{font-size:.7rem;color:#6b7280;margin-top:.2rem;}
.rl-vac-donut{position:relative;width:80px;height:80px;margin:0 auto .5rem;}
.rl-vac-donut svg{transform:rotate(-90deg);}
.rl-vac-donut .rl-vac-pct-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;color:#1e293b;}
/* Buscador */ .rl-search-box{position:relative;max-width:420px;}
.rl-search-box input{width:100%;border:2px solid #e2e8f0;border-radius:12px;padding:.65rem 1rem .65rem 2.6rem;font-size:.9rem;transition:border .2s;outline:none;}
.rl-search-box input:focus{border-color:#2563eb;}
.rl-search-box i{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:#9ca3af;}
.rl-search-list{max-height:220px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:10px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.1);display:none;margin-top:.3rem;}
.rl-search-item{padding:.6rem 1rem;cursor:pointer;font-size:.85rem;border-bottom:1px solid #f1f5f9;}
.rl-search-item:hover{background:#eff6ff;}
.rl-search-item .rl-si-dni{font-size:.72rem;color:#9ca3af;}
/* Loading */ .rl-spinner{display:flex;align-items:center;justify-content:center;padding:3rem;gap:1rem;color:#6b7280;flex-direction:column;}
.rl-spinner-circle{width:44px;height:44px;border:4px solid #e2e8f0;border-top:4px solid #2563eb;border-radius:50%;animation:rl-spin .8s linear infinite;}
@keyframes rl-spin{to{transform:rotate(360deg);}
}
/* Leyenda */ .rl-legend{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;font-size:.75rem;}
.rl-legend-item{display:flex;align-items:center;gap:.35rem;color:#374151;font-weight:600;}
.rl-legend-dot{width:12px;height:12px;border-radius:3px;}
/* Incumplidores ranking */ .rl-rank-item{display:flex;align-items:center;gap:.9rem;padding:.7rem 0;border-bottom:1px solid #f1f5f9;}
.rl-rank-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff;flex-shrink:0;}
.rl-rank-info{flex:1;}
.rl-rank-info .rl-ri-name{font-size:.85rem;font-weight:700;color:#1e293b;}
.rl-rank-info .rl-ri-sub{font-size:.72rem;color:#9ca3af;}
.rl-rank-pct{text-align:right;}
.rl-rank-pct .rl-rp-num{font-size:1.1rem;font-weight:800;}
.rl-rank-pct .rl-rp-lbl{font-size:.68rem;color:#9ca3af;}
/* Responsive */ @media(max-width:600px){.rl-header{flex-direction:column;text-align:center;}
.rl-btn-refresh{margin-left:0;}
.rl-topic-bar .rl-topic-name{flex:0 0 130px;}
.rl-kpi-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
<style>@media(max-width:700px){.rl-two-col{grid-template-columns:1fr !important;}}</style>
